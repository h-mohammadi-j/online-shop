<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Shop</title>
    <link rel="stylesheet" href="./src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body id="root">
    <!-- Menu -->
    <header
      class="w-full h-[60px] bg-linear-to-tr from-amber-800 via-amber-700 via-amber-600 to-amber-400 px-10 flex items-center justify-between text-white relative z-1 md:z-0"
    >
      <h1 class="font-bold text-3xl">Brand</h1>
      <ul
        id="nav"
        class="flex flex-col w-full -z-30 md:bg-transparent text-center perspective-[1000px] transform translate-y-[-100%] md:flex-row md:top-0 md:translate-x-0 md:left-0 transition-all duration-300 justify-center absolute bottom-30px left-0 md:flex md:gap-4 md:translate-y-0"
      >
        <li
          class="bg-amber-800 md:bg-transparent py-4 md;py-0 md:w-fit md:static md:visible md:block origin-center border-cyan-400 border-t-[1px] md:border-0 absolute w-0 opacity-0 md:opacity-100 left-0 transform transition-all duration-300 invisible cursor-pointer"
        >
          Home
        </li>
        <li
          class="bg-amber-800 md:bg-transparent py-4 md;py-0 md:opacity-100 md:w-fit md:static md:visible md:block origin-center border-cyan-400 border-t-[1px] md:border-0 absolute w-0 opacity-0 left-0 transform transition-all duration-300 invisible cursor-pointer"
        >
          Product
        </li>
        <li
          class="bg-amber-800 md:bg-transparent py-4 md;py-0 md:opacity-100 md:w-fit md:static md:visible md:block origin-center border-cyan-400 border-t-[1px] md:border-0 absolute w-0 opacity-0 left-0 transform transition-all duration-300 invisible cursor-pointer"
        >
          About
        </li>
        <li
          class="bg-amber-800 md:bg-transparent py-4 md;py-0 md:opacity-100 md:w-fit md:static md:visible md:block origin-center border-cyan-400 border-t-[1px] border-b-[1px] md:border-0 absolute w-0 opacity-0 left-0 transform transition-all duration-300 invisible cursor-pointer"
        >
          Contact
        </li>
      </ul>
      <div class="flex gap-4 z-50">
        <a
          class="cursor-pointer border-[1px] bg-amber-400 text-black border-amber-400 py-1.5 px-4 rounded-md hover:bg-transparent hover:text-white transition-all duration-300"
          href="../../components/loginForm/loginForm.html"
          >Sign In</a
        >

        <a
          class="cursor-pointer border-[1px] hover:bg-amber-400 hover:text-black border-amber-400 py-1.5 px-4 rounded-md transition-all duration-300"
          href="../../components/registrationForm/registrationForm.html"
          >Sign Up</a
        >
      </div>
      <div
        id="humburger"
        class="relative size-[20px] z-50 cursor-pointer md:hidden"
      >
        <span
          id="upLine"
          class="w-[25px] h-[2px] rounded-sm bg-white absolute tabsform top-0 transition-all duration-300"
        ></span>
        <span
          id="midLine"
          class="w-[25px] h-[2px] rounded-sm bg-white absolute tabsform top-[50%] translate-y-[-50%] transition-all duration-300"
        ></span>
        <span
          id="downLine"
          class="w-[25px] h-[2px] rounded-sm bg-white absolute tabsform bottom-0 transition-all duration-300"
        ></span>
      </div>
    </header>

    <!-- Filter section -->

    <div
      class="w-full bg-gray-300 flex flex-col md:flex-row items-center justify-center gap-2.5 py-4 px-12 sticky top-0 z-50"
    >
      <input
        id="searchFilter"
        class="bg-gray-100 py-2 px-4 border rounded-md w-full"
        type="text"
        placeholder="Search product..."
      />

      <div class="w-full flex justify-center gap-4">
        <select
          id="categoryFilter"
          class="border rounded-md w-full py-2 bg-gray-100"
        >
          <option value="all">All Category</option>
          <option value="furniture">Furniture</option>
          <option value="men">Men</option>
          <option value="women">Women</option>
          <option value="sports">Sport</option>
          <option value="accessories">Accessories</option>
          <option value="electronics">Electronics</option>
          <option value="bags">Bags</option>
          <option value="stationery">Stationery</option>
        </select>
        <select
          id="priceFilter"
          class="border rounded-md w-full py-2 bg-gray-100"
        >
          <option value="all">All Price</option>
          <option value="low">TO 80$</option>
          <option value="med">80$ To 150$</option>
          <option value="heigh">150$ To Up</option>
        </select>
      </div>
    </div>

    <!-- Products Section -->

    <div
      id="ProductsSection"
      class="w-full p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"
    ></div>

    <script src="./components/products/products.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
