<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../../src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body id="rootDashboard">
    <div class="w-full h-screen flex  ">
        
      <aside id="dashSidebar" class="min-w-[300px] h-screen z-[10] transform translate-x-[-100%] transition-all duration-300 ease-in-out bg-linear-to-b from-amber-800 via-amber-700 via-amber-600 to-amber-400 flex flex-col items-center px-4 py-6  absolute top-0 left-0 ">
        <span id="sidebarBtn" class="bg-amber-800 py-2 px-4 text-white font-bold rounded-r-lg w-[70px] text-right absolute right-[-65px] top-[10px] z-[-1] cursor-pointer opacity-50 hover:opacity-100 transition-all duration-300">M ></span>
        <h1 class="text-2xl font-bold text-white flex items-center gap-4 border-b-2 border-amber-500 py-6 px-8"><i class="text-white fas fa-dashboard"></i>Dashboard</h1>
        <ul class="w-full flex flex-col items-start justify-center gap-4 py-6 ps-6 ">
            <li class="text-white text-xl "><a class="flex items-center gap-2" href="/"><i class="text-white size-[40px] grid place-content-center  fas fa-home"></i>Home</a></li>
            <li class="text-white text-xl "><a class="flex items-center gap-2" href="/"><i class="text-white size-[40px] grid place-content-center  fas fa-shirt"></i>Products</a></li>
            <li class="text-white text-xl "><a class="flex items-center gap-2" href="/"><i class="text-white size-[40px] grid place-content-center  fas fa-clipboard-list"></i>orders</a></li>
            <li class="text-white text-xl "><a class="flex items-center gap-2" href="/"><i class="text-white size-[40px] grid place-content-center  fas fa-gears"></i>settings</a></li>
        </ul>
      </aside>
      <main id="dashMain" class="w-full flex flex-col items-center gap-4 bg-gray-200 py-4 px-8 ">
        <div class="w-full flex items-center justify-between border-b-2 border-amber-500 py-6">
            <h2 id="sectionTitle" class="text-lg md:text-3xl font-bold ">Products Management</h2>
            <div class="flex justify-center gap-4">
                <button id="addProduct" class="size-12 flex items-center justify-center  md:size-auto py-1 px-1 md:py-2 md:px-6 bg-amber-700 rounded-full text-white font-bold flex items-center gap-2 cursor-pointer transition-all duration-300 hover:bg-linear-to-br from-amber-800 via-amber-700 to-amber-500 "><span class="text-2xl">+</span> <span class="hidden md:inline-block">Add Product</span></button>
                <select id="profile" class="py-2 px-6 bg-amber-700 text-lg font-bold rounded-full text-white cursor-pointer">
                    <option selected disabled><img src="" alt=""> Profile</option>
                    <option value="setting"> Setting</option>
                    <option value="log-out" > Log Out</option>
                </select>
            </div>
        
        </div>
        <div class="w-full flex items-center justify-between gap-6 mb-6">
            <div class="border rounded-sm border-amber-700 w-full p-4 flex flex-col items-center md:flex-row gap-2 ">
                <img class="size-14 " src="../../assets/box.png" alt="">
                <div class="flex flex-col items-center gap-2">
                    <h2 class="text-md font-bold hidden md:block  ">Total Products</h2>
                    <h2 class="text-lg font-bold">15</h2>
                </div>
            </div>
            <div class="border rounded-sm border-amber-700 w-full p-4 flex flex-col items-center md:flex-row gap-2 ">
                <img class="size-14 " src="../../assets/green-tick.png" alt="">
                <div class="flex flex-col items-center gap-2">
                    <h2 class="text-lg font-bold hidden md:block  ">Active Products</h2>
                    <h2 class="text-lg font-bold">120</h2>
                </div>
            </div>
            <div class="border rounded-sm border-amber-700 w-full p-4 flex flex-col items-center md:flex-row gap-2 ">
                <img class="size-14 " src="../../assets/warning.png" alt="">
                <div class="flex flex-col items-center gap-2">
                    <h2 class="text-lg font-bold hidden md:block  ">Out of Stock</h2>
                    <h2 class="text-lg font-bold">150</h2>
                </div>
            </div>
        </div>

        <div class="w-full flex items-center justify-center gap-6">
            <div class="w-full md:w-[600px] relative ">
                <input class="w-full border border-amber-500 rounded-md py-2 ps-8  bg-white" type="search" placeholder="Search Products">
                <i class="absolute top-[50%] left-[10px] transform translate-y-[-50%] text-gray-400 size-[40px] grid place-content-center  fas fa-magnifying-glass"></i>
            </div>
            <select name="" id="categoryDash" class="w-[200px] md:w-[300px] py-2 border border-amber-500 bg-white px-6 rounded-md ">
                <option value="">Category: All</option>
                <option value="">Category: All</option>
                <option value="">Category: All</option>
                <option value="">Category: All</option>
                <option value="">Category: All</option>
                <option value="">Category: All</option>
            </select>

        </div>
        <div class="w-full flex justify-center">
            <table class="w-full lg:w-[1000px] border border-collapse border-amber-800 table-auto ">
                <thead class="">
                    <tr class="bg-amber-500 border border-amber-800 ">
                        <th class="py-2">Product Name</th>
                        <th class="py-2">Price</th>
                        <th class="py-2">Stock</th>
                        <th class="py-2">Status</th>
                        <th class="py-2">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border border-amber-800">
                        <td class="py-2.5 text-center font-bold">Iphone 13 promax</td>
                        <td class="py-4 text-center font-bold">1100 $</td>
                        <td class="py-2.5 text-center font-bold flex items-center justify-center "><span class="flex items-center gap-2 justify-center bg-red-600 w-fit py-1.5 px-2.5 min-w-[120px] rounded-full text-white shadow-[0_0_3px_rgba(0,0,0,0.5)_inset] hidden md:block">Out of Stock</span><span class="text-2xl md:hidden flex items-center gap-2 justify-center bg-red-600  py-1.5 px-2.5 size-10 rounded-full text-white shadow-[0_0_3px_rgba(0,0,0,0.5)_inset]">¡</span></td>
                        <td class="py-2.5 text-center font-bold text-red-600">Inactive</td>
                        <td class="py-2.5 text-center font-bold flex items-center justify-center gap-4">
                            <button class="py-2.5 px-2.5 md:py-1.5 md:px-4 flex items-center justify-center gap-4 border border-amber-600 rounded-lg bg-gray-400 text-white cursor-pointer">
                                <i class="fa-solid fa-pencil"></i>
                                <span class="hidden md:block">Edit</span>
                            </button>
                            <button class="py-2.5 px-2.5 md:py-1.5 md:px-4 flex items-center justify-center gap-4 border border-amber-600 rounded-lg bg-red-400 text-white cursor-pointer">
                                <i class="fa-regular fa-trash-can"></i>
                                <span class="hidden md:block">Delete</span>
                            </button>
                        </td>
                    </tr>
                    <tr class="border border-amber-800">
                        <td class="py-2.5 text-center font-bold">Iphone 13 promax</td>
                        <td class="py-4 text-center font-bold">1100 $</td>
                        <td class="py-2.5 text-center font-bold flex items-center justify-center "><span class="flex items-center gap-2 justify-center bg-green-600 size-10 md:py-1.5 md:px-2 rounded-full text-white shadow-[0_0_3px_rgba(0,0,0,0.5)_inset] md:min-w-[120px]"><i class="fa-solid fa-check"></i> <span class="hidden md:inline-block">Stock</span></span></td>
                        <td class="py-2.5 text-center font-bold text-green-600">Active</td>
                        <td class="py-2.5 text-center font-bold flex items-center justify-center gap-4">
                            <button class="py-2.5 px-2.5 md:py-1.5 md:px-4 flex items-center justify-center gap-4 border border-amber-600 rounded-lg bg-gray-400 text-white cursor-pointer">
                                <i class="fa-solid fa-pencil"></i>
                                <span class="hidden md:block">Edit</span>
                            </button>
                            <button class="py-2.5 px-2.5 md:py-1.5 md:px-4 flex items-center justify-center gap-4 border border-amber-600 rounded-lg bg-red-400 text-white cursor-pointer">
                                <i class="fa-regular fa-trash-can"></i>
                                <span class="hidden md:block">Delete</span>
                            </button>
                        </td>
                    </tr>
                    
                    
                </tbody>
            </table>
        </div>
      </main>
    </div>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
