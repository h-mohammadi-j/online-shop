<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login Form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- <link rel="stylesheet" href="style.css" /> -->
     <link rel="stylesheet" href="../../src/output.css">
  </head>

  <body class="flex items-center justify-center min-h-screen bg-linear-[to bottom,#8b4513,#d2691e,#ffa500,#f4a460] overflow-hidden relative font-[Segoe UI,Tahoma,Geneva,Verdana,sans-serif]">
    <div class="relative w-full h-screen flex items-center justify-center">
      <!-- Background Elements -->
      <div class="tree tree-1">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
      <div class="tree tree-2">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
      <div class="tree tree-3">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
      <div class="tree tree-4">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>

      <div class="path"></div>

      <div class="chair chair-1">
        <div class="chair-back"></div>
        <div class="chair-base"></div>
      </div>
      <div class="chair chair-2">
        <div class="chair-back"></div>
        <div class="chair-base"></div>
      </div>

      <div class="falling-leaves" id="leaves-container"></div>

      <!-- Login Form -->
      <div class="relative w-[600px] p-[40px] bg-[rgba(255,255,255,0.15)] backdrop-blur-[10px] rounded-[20px] shadow-[0_15px_35px_rgba(0,0,0,0.2)] border border-[rgba(255,255,255,0.1)] z-[10] animate-[fadeIn_1s_ease-out]">
        
        <h2 class="text-white text-center mb-[30px] font-[600] text-shadow-[0_2px_5px_rgba(0,0,0,0.2)]">Registration Form</h2>

        <form id="loginForm">
          <div id="fullName" class="w-full grid grid-cols-2 gap-1">
            <div class="input-group">
              <input class=".inputW-full" type="text" placeholder="First Name" required />
              <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
              <input class=".inputW-full" type="text" placeholder="Last Name" required />
              <i class="fas fa-user"></i>
            </div>

          </div>

          <div class="input-group">
            <input class="inputW-full" type="tel" placeholder="Phone Number" required />
            <i class="fas fa-user"></i>
          </div>
          <div class="input-group">
            <input class="inputW-full" type="email" placeholder="Email" required />
            <i class="fas fa-user"></i>
          </div>
          <div class="input-group">
            <inpu class="inputW-full"t type="password" placeholder="Password" required />
            <i class="fas fa-lock"></i>
          </div>
          <div class="input-group">
            <input class="inputW-full" type="password" placeholder="Confirm Password" required />
            <i class="fas fa-lock"></i>
          </div>
          <button type="submit" class="login-btn">Create Account</button>
          <div class="form-footer">
            <p>
              Do you have an account?
              <a class="login-btn" href="../new-login/newLogin.html">Sign In</a>
            </p>
            <!-- <p><a href="#">Forgot Password?</a></p> -->
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
