<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login Form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Background Elements -->
      <div class="tree tree-1">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
      <div class="tree tree-2">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
      <div class="tree tree-3">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
      <div class="tree tree-4">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>

      <div class="path"></div>

      <div class="chair chair-1">
        <div class="chair-back"></div>
        <div class="chair-base"></div>
      </div>
      <div class="chair chair-2">
        <div class="chair-back"></div>
        <div class="chair-base"></div>
      </div>

      <div class="falling-leaves" id="leaves-container"></div>

      <!-- Login Form -->
      <div class="login-form">
        <h2>Registration Form</h2>
        <form id="loginForm">
          <div id="fullName">
            <div class="input-group">
              <input type="text" placeholder="First Name" required />
              <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
              <input type="text" placeholder="Last Name" required />
              <i class="fas fa-user"></i>
            </div>

          </div>

          <div class="input-group">
            <input type="tel" placeholder="Phone Number" required />
            <i class="fas fa-user"></i>
          </div>
          <div class="input-group">
            <input type="email" placeholder="Email" required />
            <i class="fas fa-user"></i>
          </div>
          <div class="input-group">
            <input type="password" placeholder="Password" required />
            <i class="fas fa-lock"></i>
          </div>
          <div class="input-group">
            <input type="password" placeholder="Confirm Password" required />
            <i class="fas fa-lock"></i>
          </div>
          <button type="submit" class="login-btn">Create Account</button>
          <div class="form-footer">
            <p>
              Do you have an account?
              <a href="../new-login/newLogin.html">Sign In</a>
            </p>
            <!-- <p><a href="#">Forgot Password?</a></p> -->
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
